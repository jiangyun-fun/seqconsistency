name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install .[dev]
      - run: ruff check src tests benchmarks
      - run: mypy
      - run: pytest
